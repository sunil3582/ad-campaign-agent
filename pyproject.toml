[project]
name = "ad-budget-guardian"
version = "0.1.0"
description = "Human-approved ad budget recommendations with a safe execution harness"
requires-python = ">=3.11,<3.14"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "google-genai>=1.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
guardian = "guardian.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

